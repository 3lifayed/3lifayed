name: Update profile visuals

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/profile-visuals.yml

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@v6
      - name: Generate stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=FFFFFF&title_color=0F766E&text_color=24292F&icon_color=0F766E&border_color=D0D7DE
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=490&bg_color=FFFFFF&title_color=0F766E&text_color=24292F&icon_color=0F766E&border_color=D0D7DE
          path: assets/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=2DD4BF&text_color=E6EDF3&icon_color=2DD4BF&border_color=30363D
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=490&bg_color=0D1117&title_color=2DD4BF&text_color=E6EDF3&icon_color=2DD4BF&border_color=30363D
          path: assets/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=false&ring=2DD4BF&fire=2DD4BF&background=FFFFFF&sideNums=24292F&currStreakNum=24292F&sideLabels=24292F&dates=57606A&currStreakLabel=0F766E
          path: assets/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=false&ring=2DD4BF&fire=2DD4BF&background=0D1117&sideNums=E6EDF3&currStreakNum=E6EDF3&sideLabels=E6EDF3&dates=8B949E&currStreakLabel=2DD4BF
          path: assets/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=%230F766E&color_dots=%23ebedf0,%2399f6e4,%235eead4,%232dd4bf,%230f766e
            assets/snake-dark.svg?palette=github-dark&color_snake=%232DD4BF&color_dots=%23161b22,%2313423c,%23115e59,%2314b8a6,%232dd4bf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/languages-*.svg assets/streak-*.svg assets/snake-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile statistics and contribution animation"
          git push
